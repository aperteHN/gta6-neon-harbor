<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neon Harbor — Solstice City Heist: an original open-world crime game in the browser. Drive, steal cars, outrun the police and run a five-chapter heist story.">
<meta name="theme-color" content="#0b1020">
<title>Neon Harbor — Solstice City Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020 radial-gradient(120% 90% at 50% 0%, #1b2a4a 0%, #0b1020 62%); font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor: open-world crime game. WASD move, E enter car, F steal, H horn, mouse aim, click shoot, Shift sprint, K save, P or Esc pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff;font-family:system-ui,sans-serif;padding:2rem">Neon Harbor needs JavaScript: the whole city is simulated in your browser, offline.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
